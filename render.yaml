services:
  - type: static_site
    name: petunia
    runtime: static
    buildCommand: |
      echo "EXPO_PUBLIC_AI_PROVIDER=$EXPO_PUBLIC_AI_PROVIDER" > .env
      echo "EXPO_PUBLIC_AI_API_KEY=$EXPO_PUBLIC_AI_API_KEY" >> .env
      echo "EXPO_PUBLIC_AI_MODEL=$EXPO_PUBLIC_AI_MODEL" >> .env
      npm install --include=dev && npm run build:web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /**
        destination: /index.html
